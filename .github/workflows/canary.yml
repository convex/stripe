name: Canary

# Runs the full suite against the newest stripe and convex releases, so
# upstream changes show up here before a Renovate PR or a user hits them.
on:
  schedule:
    - cron: "17 13 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: canary
  cancel-in-progress: false

jobs:
  canary:
    name: Newest Stripe and Convex releases
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      STRIPE_E2E_LATEST_API_VERSION: "true"
    steps:
      # Only this step and the end-to-end step see the key, so the install
      # scripts of the unvetted releases below can't read it.
      - name: Check for a Stripe key
        id: stripe-key
        env:
          STRIPE_E2E_SECRET_KEY: ${{ secrets.STRIPE_E2E_SECRET_KEY }}
        run: |
          if [ -n "$STRIPE_E2E_SECRET_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Node setup
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.x"
      - name: Install the newest stripe and convex releases
        run: |
          npm ci
          npm install --no-save --min-release-age=0 stripe@latest convex@latest
          npm ls stripe convex --depth=0 || true
      - name: Build, test, and typecheck
        run: |
          npm run build
          npm test
          npm run typecheck
      - uses: ./.github/actions/setup-stripe-cli
        if: steps.stripe-key.outputs.present == 'true'
      - name:
          End-to-end, with real Stripe webhooks on the latest API version when a
          key is set
        env:
          STRIPE_E2E_SECRET_KEY: ${{ secrets.STRIPE_E2E_SECRET_KEY }}
        run: npm run test:e2e

  report:
    name: Report failure
    needs: canary
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open or update the canary issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{
            github.run_id }}
        run: |
          title="Canary: the newest stripe or convex release breaks the component"
          body="The nightly canary failed against the newest stripe and convex releases: $RUN_URL"
          issue=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number')
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
